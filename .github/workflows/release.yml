# Tag-gated release: push a v* tag -> backend + frontend tests run ->
# deploy-api and deploy-web branches fast-forward to the tag -> SnapDeploy
# rebuilds exactly one container per branch. Plain pushes to main deploy
# nothing, and each release costs one deploy unit per container.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to fast-forward the deploy branches on green builds

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install uv
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx --no-install tsc --noEmit
      - run: npm run lint

  rollout:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # HEAD is the tag (detached). Plain fast-forward push: fails loudly
      # instead of overwriting if a deploy branch ever moves unexpectedly.
      - run: git push origin "HEAD:refs/heads/deploy-api" "HEAD:refs/heads/deploy-web"
