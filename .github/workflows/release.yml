# Tag-gated release: push a v* tag -> tests run -> GitHub Release is
# created only if everything is green -> Northflank deploys the release.
# Plain pushes to main build nothing (Northflank CI is disabled on purpose
# to save build minutes). Requires-python and tool versions mirror CI below.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the GitHub Release on green builds

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install uv
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx --no-install tsc --noEmit
      - run: npm run lint

  publish-release:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
