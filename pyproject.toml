[project]
name = "legalbuddy-cv"
version = "0.1.0"
description = "LegalBuddy — grounded Bangladesh legal research copilot (Meta AI Developer Hackathon)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "fastembed>=0.5.1",
    "langchain-postgres>=0.0.19",
    "openai>=1.50.0",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.21.4",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.12.0",
    "tqdm>=4.66.0",
    "uvicorn>=0.30.0",
    "voyageai>=0.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legalbuddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
