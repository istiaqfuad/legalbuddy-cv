[project]
name = "legalbuddy-cv"
version = "0.1.0"
description = "LegalBuddy — grounded Bangladesh legal research copilot (Meta AI Developer Hackathon)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastembed>=0.5.1",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.12.0",
    "tqdm>=4.66.0",
    "voyageai>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legalbuddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
